version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evenly-study-db
    environment:
      POSTGRES_DB: evenly_study
      POSTGRES_USER: evenly_user
      POSTGRES_PASSWORD: evenly_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
